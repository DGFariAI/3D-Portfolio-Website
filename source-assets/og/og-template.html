<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0b080c; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0b080c;
    font-family: "Geist", system-ui, sans-serif;
    color: #fff;
  }

  /* The portfolio's own backlight: the .character-rim recipe from Landing.css
     verbatim. A pink disc with a violet-blue inset shadow pushed off centre,
     blurred hard. That offset is what makes it read as two colours, warm on
     one side and cool on the other, rather than as one flat wash.

     The ground under it is plain --backgroundColor, which is what the hero
     sits on in the portfolio too. */
  .rim {
    position: absolute;
    left: var(--rim-x);
    top: var(--rim-y);
    width: var(--rim-size);
    height: var(--rim-size);
    border-radius: 50%;
    background-color: #f59bf8;
    box-shadow: inset var(--rim-shadow);
    filter: blur(var(--rim-blur));
    transform: translate(-50%, -50%) scale(var(--rim-scale));
  }

  .hero {
    position: absolute;
    right: 0;
    bottom: -14px;
    width: var(--hero-w);
    height: auto;
  }

  .left {
    position: absolute;
    left: 78px;
    top: 126px;
    width: 570px;
  }

  /* Icon then wordmark, at the portfolio navbar's own proportions: the icon is
     1.75x the type size there and the gap is half of it. */
  .mark {
    display: flex;
    align-items: center;
    gap: 26px;
    margin: 0;
    font-size: 60px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .mark img {
    width: 96px;
    height: 96px;
    object-fit: contain;
  }

  .tag {
    margin: 26px 0 0;
    font-size: 25px;
    font-weight: 500;
    letter-spacing: 3.2px;
    background: linear-gradient(90deg, #cbb6ff 0%, #efe9f6 55%, #cbb6ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .rule {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 420px;
    margin: 30px 0 0;
  }
  .rule span {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(194, 164, 255, 0.75));
  }
  .rule span:last-child {
    background: linear-gradient(90deg, rgba(194, 164, 255, 0.75), transparent);
  }
  .rule svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    fill: #c2a4ff;
    filter: drop-shadow(0 0 8px rgba(194, 164, 255, 0.75));
  }

  /* Five now rather than four, so they are set a little tighter to hold the
     column without wrapping. */
  .pills { display: flex; gap: 11px; margin-top: 28px; }
  .pills span {
    padding: 10px 19px;
    font-size: 19px;
    font-weight: 500;
    white-space: nowrap;
    border: 1px solid rgba(194, 164, 255, 0.38);
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(194, 164, 255, 0.12), rgba(11, 8, 12, 0.4));
  }

  .domain {
    margin: 32px 0 0;
    font-size: 23px;
    font-weight: 500;
    letter-spacing: 1.4px;
    color: #c2a4ff;
  }
</style>
</head>
<body>
<div class="card">
  <div class="rim" id="rim"></div>
  <img class="hero" id="hero" src="">

  <div class="left">
    <p class="mark">
      <img id="icon" src="" alt="">
      itsdgfari
    </p>

    <p class="tag">KINGDOM BUILDER &amp; MARKETER</p>

    <div class="rule">
      <span></span>
      <svg viewBox="0 0 24 24"><path d="M12 0c.8 6.2 5 10.4 11.2 11.2v1.6C17 13.6 12.8 17.8 12 24c-.8-6.2-5-10.4-11.2-11.2v-1.6C7 10.4 11.2 6.2 12 0z"/></svg>
      <span></span>
    </div>

    <div class="pills">
      <span>AI</span><span>Art</span><span>Learn</span><span>Portfolio</span><span>Studio</span>
    </div>

    <p class="domain">dgfari.com</p>
  </div>
</div>
</body>
</html>
