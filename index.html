<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/itsdgfari_icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DGFari</title>

    <!-- Fonts: preconnect so the handshake overlaps with HTML parsing, and load
         via <link> rather than a CSS @import, which would not start until the
         stylesheet itself had been fetched and parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
    />
    
    <!-- Open Graph meta tags for social media sharing -->
    <meta property="og:title" content="DGFari" />
    <meta property="og:description" content="Kingdom builder and marketer. Portfolio, writing, art and studio, all in one place." />
    <!-- Absolute URL: several unfurlers, Slack and iMessage among them, will
         not resolve a root-relative og:image. Width and height let them lay the
         card out before the image has finished downloading, which is the
         difference between a large card and a small one in some clients. -->
    <meta property="og:image" content="https://dgfari.com/dgfari-og.jpg?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="itsdgfari, kingdom builder and marketer: portfolio, learn, art and studio" />
    <meta property="og:url" content="https://dgfari.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DGFari" />
    
    <!-- Additional meta tags for better LinkedIn integration -->
    <meta name="author" content="Danica Gabriella Fariñas Melecio" />
    <meta name="description" content="Kingdom builder and marketer. Portfolio, writing, art and studio, all in one place." />
    <meta name="keywords" content="DGFari, kingdom builder, marketer, portfolio, blog, AI, brand storytelling, art, studio" />
    
    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DGFari" />
    <meta name="twitter:description" content="Kingdom builder and marketer. Portfolio, writing, art and studio, all in one place." />
    <meta name="twitter:image" content="https://dgfari.com/dgfari-og.jpg?v=2" />
    <meta name="twitter:image:alt" content="itsdgfari, kingdom builder and marketer: portfolio, learn, art and studio" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
