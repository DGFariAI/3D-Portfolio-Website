<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0b080c; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0b080c;
    font-family: "Geist", system-ui, sans-serif;
    color: #fff;
  }

  /* The same violet bloom the character sits inside on the site, centred on
     her head rather than on the middle of the card. */
  .glow {
    position: absolute;
    top: -160px;
    left: 424px;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      rgba(139, 92, 246, 0.55) 0%,
      rgba(120, 70, 220, 0.3) 34%,
      rgba(60, 30, 110, 0.12) 56%,
      rgba(11, 8, 12, 0) 72%
    );
  }

  .hero {
    position: absolute;
    right: 6px;
    bottom: -16px;
    width: 668px;
    height: auto;
  }

  .left {
    position: absolute;
    left: 78px;
    top: 148px;
    width: 560px;
  }

  h1 {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0;
    font-size: 62px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .badge { width: 40px; height: 40px; flex-shrink: 0; overflow: visible; }

  .tag {
    margin: 22px 0 0;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 3.4px;
    background: linear-gradient(90deg, #cbb6ff 0%, #efe9f6 55%, #cbb6ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .rule {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 420px;
    margin: 34px 0 0;
  }
  .rule span {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(194, 164, 255, 0.75));
  }
  .rule span:last-child {
    background: linear-gradient(90deg, rgba(194, 164, 255, 0.75), transparent);
  }
  .rule svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    fill: #c2a4ff;
    filter: drop-shadow(0 0 8px rgba(194, 164, 255, 0.75));
  }

  .pills { display: flex; gap: 14px; margin-top: 32px; }
  .pills span {
    padding: 12px 24px;
    font-size: 21px;
    font-weight: 500;
    border: 1px solid rgba(194, 164, 255, 0.38);
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(194, 164, 255, 0.12), rgba(11, 8, 12, 0.4));
  }

  .domain {
    margin: 36px 0 0;
    font-size: 23px;
    font-weight: 500;
    letter-spacing: 1.4px;
    color: #c2a4ff;
  }
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <img class="hero" id="hero" src="">

  <div class="left">
    <h1>
      itsdgfari
      <svg class="badge" viewBox="0 0 48 48">
        <path fill="#8b5cf6" d="M24.00 1.00 L29.24 6.15 L36.43 4.65 L38.06 11.82 L44.92 14.45 L42.41 21.35 L46.77 27.27 L40.92 31.73 L41.38 39.06 L34.06 39.65 L30.48 46.07 L24.00 42.60 L17.52 46.07 L13.94 39.65 L6.62 39.06 L7.08 31.73 L1.23 27.27 L5.59 21.35 L3.08 14.45 L9.94 11.82 L11.57 4.65 L18.76 6.15 Z"/>
        <path d="M15.5 24.5 L21.5 30.5 L32.5 18.5" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </h1>

    <p class="tag">KINGDOM BUILDER &amp; MARKETER</p>

    <div class="rule">
      <span></span>
      <svg viewBox="0 0 24 24"><path d="M12 0c.8 6.2 5 10.4 11.2 11.2v1.6C17 13.6 12.8 17.8 12 24c-.8-6.2-5-10.4-11.2-11.2v-1.6C7 10.4 11.2 6.2 12 0z"/></svg>
      <span></span>
    </div>

    <div class="pills">
      <span>Portfolio</span><span>Learn</span><span>Art</span><span>Studio</span>
    </div>

    <p class="domain">dgfari.com</p>
  </div>
</div>
</body>
</html>
